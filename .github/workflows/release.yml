name: Release

# Trusted entry point for publishing: it grants packages:write to ci.yml,
# which requests no permissions of its own so read-only callers (try.yml) can
# also call it.
on:
  push:
    branches: [main, staging, trying, develop]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
